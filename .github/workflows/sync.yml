name: Goodreads Sync

on:
  # Allow manual trigger
  workflow_dispatch:
  schedule:
    # Runs at 00:00 and 12:00 UTC
    - cron: '3 0,12 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate read list
        env: 
          CONFIG: ${{ secrets.GOODREADS_CONFIG }}
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/app \
            -v ${{ github.workspace }}:/data \
            -v ${{ github.workspace }}:/render \
            ghcr.io/jvrsantacruz/goodreads:latest \
            render read \
              --config-json "$CONFIG" \
              --data-dir /data \
              --listas-dir /render \
              --books-dir /render

      - name: Generate want list
        env: 
          CONFIG: ${{ secrets.GOODREADS_CONFIG }}
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/app \
            -v ${{ github.workspace }}:/data \
            -v ${{ github.workspace }}:/render \
            ghcr.io/jvrsantacruz/goodreads:latest \
            render want \
              --config-json "$CONFIG" \
              --data-dir /data \
              --listas-dir /render \
              --books-dir /render

      - name: See render results
        run: ls -lR

      - name: See render results file
        run: cat *.md

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: 'Update Goodreads lists'
          file_pattern: '*.md'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'