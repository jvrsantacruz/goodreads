name: Goodreads Sync

on:
  # Allow manual trigger
  workflow_dispatch:
  schedule:
    # Runs at 00:00 and 12:00 UTC
    - cron: '3 0,12 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate read list
        env: 
          CONFIG: ${{ secrets.GOODREADS_CONFIG }}
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/app \
            -v ${{ github.workspace }}:/data \
            -v ${{ github.workspace }}:/render \
            ghcr.io/jvrsantacruz/goodreads:latest \
            render read \
              --config-json "$CONFIG" \
              --data-dir /data \
              --listas-dir /render \
              --books-dir /render

      - name: Generate want list
        env: 
          CONFIG: ${{ secrets.GOODREADS_CONFIG }}
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/app \
            -v ${{ github.workspace }}:/data \
            -v ${{ github.workspace }}:/render \
            ghcr.io/jvrsantacruz/goodreads:latest \
            render want \
              --config-json "$CONFIG" \
              --data-dir /data \
              --listas-dir /render \
              --books-dir /render

      - name: See render results
        run: ls -lR

      - name: See render results file
        run: cat *.md || echo "No markdown files to display"

      - name: Clone target repository
        uses: actions/checkout@v4
        with:
          repository: jvrsantacruz/me
          token: ${{ secrets.ME_REPO_TOKEN }}
          path: me-repo

      - name: Copy generated files to target repo
        run: |
          cp *.md me-repo/ || echo "No markdown files to copy"
          
      - name: Commit and push to target repository
        run: |
          cd me-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.md || echo "No markdown files to add"
          git diff --staged --quiet || git commit -m "Update Goodreads lists $(date)"
          git push